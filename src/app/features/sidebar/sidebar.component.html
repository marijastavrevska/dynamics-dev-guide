<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-row">
      <div class="logo-mark">D3</div>
      <span class="logo-text">Dev Knowledge Base</span>
    </div>
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="#555" stroke-width="1.3"/>
        <line x1="10" y1="10" x2="14" y2="14" stroke="#555" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search developments..."
        [value]="nav.searchQuery()"
        (input)="onSearch($event)"
      />
    </div>
  </div>

  <nav class="nav-area">
    <div class="nav-section-label">Developments</div>
    @for (dev of filtered(); track dev.id) {
      <app-nav-item
        [id]="dev.id"
        [title]="dev.title"
        [meta]="metaFor(dev)"
        [isNew]="isNew(dev)"
        [isActive]="isActive(dev.id)"
      />
    }
    @if (filtered().length === 0) {
      <div class="no-results">No results</div>
    }
  </nav>
</aside>
